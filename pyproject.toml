[project]
name = "agent0"
version = "0.1.0"
description = "General-purpose multi-model agent harness that completes tasks and verifies the work."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "pydantic-ai-slim[google,groq,mcp,openai]>=1.0",
    "groq>=0.30",
    "google-genai>=1.30",
    "temporalio>=1.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "aiogram>=3.15",
    "docker>=7.1",
    "typer>=0.15",
    "rich>=13.9",
    "pillow>=13.0.0",
    "jsonschema>=4.26.0",
    "cryptography>=50.0.2",
    "python-dotenv>=1.2.4",
    "e2b>=2.64.0",
    "croniter>=7.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]

[project.scripts]
agent0 = "agent0.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent0"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs Docker/Postgres/API keys"]
addopts = "-m 'not integration'"

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
