services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent0
      POSTGRES_PASSWORD: agent0
      POSTGRES_DB: agent0
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../src/agent0/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

volumes:
  pgdata:
