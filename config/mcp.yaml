# Servers are attached per agent via `mcp:` in agent.md. Values may use ${VAR} or ${VAR:-default}.
servers:
  - name: filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${AGENT0_MCP_FS_ROOT:-.}"]
    description: Read and write files under one directory.
